<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background-color: #f4f4f4; margin: 0; padding: 20px; }
        .header { background-color: #123456; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 20px; }
        .container { max-width: 900px; margin: 30px auto; }
        .form-box { background-color: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 30px; }
        .form-box h2 { margin-top: 0; }
        .field { margin-bottom: 15px; }
        .field label { display: block; margin-bottom: 5px; font-weight: bold; }
        .field input, .field textarea, .field select { width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 5px; }
        .add-btn { background-color: #123456; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .add-btn:hover { background-color: #ff9900; color: #333; }
        .list-box { background-color: white; border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px; margin-top: 30px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #e0e0e0; }
        .item:last-child { border-bottom: none; }
        .delete-btn { background-color: #cc0000; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .msg-box { background-color: #ff9900; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; display: none; }
        .success { background-color: #00cc00 !important; }
        .error { background-color: #cc0000 !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1>لوحة التحكم</h1>
    </div>
    <div class="container">
        <!-- شاشة الرسائل -->
        <div id="msg-box" class="msg-box"></div>

        <!-- إضافة قسم -->
        <div class="form-box">
            <h2>إضافة قسم</h2>
            <div class="field">
                <input type="text" id="new-category" placeholder="اسم القسم (مثل: رياضة)">
            </div>
            <button class="add-btn" onclick="addCategory()">إضافة قسم</button>
        </div>

        <!-- إضافة موضوع -->
        <div class="form-box" style="margin-top: 30px;">
            <h2>إضافة موضوع</h2>
            <div class="field">
                <input type="text" id="article-title" placeholder="عنوان الموضوع">
            </div>
            <div class="field">
                <select id="article-category">
                    <option value="">اختر القسم</option>
                </select>
            </div>
            <div class="field">
                <input type="url" id="article-image" placeholder="رابط الصورة">
            </div>
            <div class="field">
                <textarea id="article-content" rows="10" placeholder="نص المقالة"></textarea>
            </div>
            <button class="add-btn" onclick="addArticle()">إضافة موضوع</button>
        </div>

        <!-- قائمة المواضيع -->
        <div class="list-box">
            <h2>قائمة المواضيع</h2>
            <div id="articles-list"></div>
        </div>
    </div>

    <!-- استيراد Firebase (مباشرة من السحابة) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // هذا هو الكود الذي يجعل كل شيء يعمل! (مشروع 1980)
        const firebaseConfig = {
            apiKey: "AIzaSyBdpCRwQ14IdBa-gFV-Hh5d2gj_oDzdGp0",
            authDomain: "iraq-net-1980.firebaseapp.com",
            projectId: "iraq-net-1980",
            storageBucket: "iraq-net-1980.firebasestorage.app",
            messagingSenderId: "901603428041",
            appId: "1:901603428041:web:2d97f014a67566799aaf18",
            measurementId: "G-85CPBXHYCJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // دالة إظهار الرسائل
        function showMessage(message, type) {
            const msgBox = document.getElementById('msg-box');
            msgBox.innerHTML = message;
            msgBox.style.display = 'block';
            msgBox.classList.remove('success', 'error');
            if (type === 'success') {
                msgBox.classList.add('success');
            } else if (type === 'error') {
                msgBox.classList.add('error');
            }
            // إخفاء الرسالة تلقائياً بعد 5 ثواني
            setTimeout(function() {
                msgBox.style.display = 'none';
            }, 5000);
        }

        // إضافة قسم
        function addCategory() {
            const name = document.getElementById('new-category').value;
            if (!name) {
                showMessage('خطأ: أدخل اسم القسم أولاً', 'error');
                return;
            }
            addDoc(collection(db, 'categories'), { name: name })
                .then(() => {
                    showMessage('تم إضافة القسم بنجاح!', 'success');
                    document.getElementById('new-category').value = '';
                    loadCategories();
                })
                .catch((error) => {
                    showMessage('خطأ: لم يتم إضافة القسم. السبب: ' + error.message, 'error');
                });
        }

        // تحميل الأقسام
        function loadCategories() {
            getDocs(collection(db, 'categories'))
                .then((snapshot) => {
                    const select = document.getElementById('article-category');
                    select.innerHTML = '<option value="">اختر القسم</option>';
                    snapshot.forEach((doc) => {
                        const cat = doc.data();
                        select.innerHTML += `<option value="${doc.id}">${cat.name}</option>`;
                    });
                })
                .catch((error) => {
                    showMessage('خطأ: لم يتم تحميل الأقسام. السبب: ' + error.message, 'error');
                });
        }

        // إضافة موضوع
        function addArticle() {
            const title = document.getElementById('article-title').value;
            const categoryId = document.getElementById('article-category').value;
            const image = document.getElementById('article-image').value;
            const content = document.getElementById('article-content').value;
            if (!title || !categoryId || !image || !content) {
                showMessage('خطأ: أدخل جميع الحقول (عنوان، قسم، صورة، نص)', 'error');
                return;
            }
            addDoc(collection(db, 'articles'), {
                title: title,
                categoryId: categoryId,
                imageUrl: image,
                content: content,
                createdAt: new Date()
            })
                .then(() => {
                    showMessage('تم إضافة الموضوع بنجاح!', 'success');
                    document.getElementById('article-title').value = '';
                    document.getElementById('article-image').value = '';
                    document.getElementById('article-content').value = '';
                    loadArticles();
                })
                .catch((error) => {
                    showMessage('خطأ: لم يتم إضافة الموضوع. السبب: ' + error.message, 'error');
                });
        }

        // تحميل المواضيع
        function loadArticles() {
            const q = query(collection(db, 'articles'), orderBy('createdAt', 'desc'));
            getDocs(q)
                .then((snapshot) => {
                    const list = document.getElementById('articles-list');
                    list.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const article = doc.data();
                        list.innerHTML += `
                            <div class="item">
                                <div>
                                    <strong>${article.title}</strong><br>
                                    <small>${article.content.substring(0, 50)}...</small>
                                </div>
                                <button class="delete-btn" onclick="deleteArticle('${doc.id}')">حذف</button>
                            </div>`;
                    });
                })
                .catch((error) => {
                    showMessage('خطأ: لم يتم تحميل المواضيع. السبب: ' + error.message, 'error');
                });
        }

        // حذف موضوع
        function deleteArticle(id) {
            deleteDoc(doc(db, 'articles', id))
                .then(() => {
                    showMessage('تم حذف الموضوع بنجاح!', 'success');
                    loadArticles();
                })
                .catch((error) => {
                    showMessage('خطأ: لم يتم حذف الموضوع. السبب: ' + error.message, 'error');
                });
        }

        loadCategories();
        loadArticles();
    </script>
</body>
</html>
