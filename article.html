    <style>

        body { background-color: #f4f4f4; margin: 0; padding: 0; }

        .search-btn svg { width: 30px; height: 30px; }
        .install-btn { display: none; background: #ff9900; color: #123456; border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer; }
        .install-btn.visible { display: block; }
        .search-area { display: none; flex: 1; max-width: 420px; }
        .search-area.open { display: flex; gap: 8px; }
        .search-area input { flex: 1; min-width: 0; padding: 10px 12px; border: 0; border-radius: 8px; font-family: inherit; }
        .search-area button { padding: 9px 14px; border: 0; border-radius: 8px; cursor: pointer; color: #123456; font-weight: bold; }
        .categories-bar { position: sticky; top: 0; z-index: 1000; background-color: #ffffff; padding: 12px 20px; display: flex; gap: 12px; overflow: visible; white-space: nowrap; border-bottom: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .category-link { display: inline-flex; align-items: center; color: #123456; text-decoration: none; font-size: 15px; font-weight: 700; padding: 8px 12px; border-radius: 8px; }
        .category-link:hover { color: #ff9900; background: #f7f9fb; }
        .category-item { position: relative; z-index: 1001; display: inline-flex; align-items: center; }
        .category-toggle { flex: 0 0 28px; width: 28px; height: 28px; margin-right: 2px; border: 0; background: transparent; color: #123456; cursor: pointer; padding: 0; font: inherit; font-size: 25px; font-weight: 900; line-height: 22px; text-align: center; transition: transform 0.2s, color 0.2s; }
        .category-toggle:hover, .category-item.open > .category-toggle { background: transparent; color: #ff9900; }
        .category-item.open > .category-toggle { transform: rotate(180deg); }
        .sub-menu { position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.16); display: none; min-width: 180px; z-index: 1002; padding: 8px 0; }
        .category-item.open .sub-menu { display: block; }
        @media (hover: hover) and (pointer: fine) { .category-item:hover .sub-menu { display: block; } }
        .sub-menu a { display: block; padding: 10px 12px; color: #123456; text-decoration: none; font-weight: 700; }
        .sub-menu a:hover { background: #f4f4f4; }
        .latest-ticker { position: sticky; top: var(--categories-bar-height, 60px); z-index: 999; display: flex; align-items: center; gap: 12px; overflow: hidden; background: #123456; color: white; min-height: 42px; padding: 0 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
        .latest-ticker-label { flex: 0 0 auto; background: #ff9900; color: #123456; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 700; }
        .latest-ticker-window { flex: 1; overflow: hidden; direction: ltr; }
        .latest-ticker-track { display: inline-flex; gap: 42px; min-width: max-content; direction: rtl; animation: latestTickerMove 45s linear infinite; }
        .latest-ticker:hover .latest-ticker-track, .latest-ticker:focus-within .latest-ticker-track { animation-play-state: paused; }
        .latest-ticker-link { color: white; text-decoration: none; font-size: 14px; font-weight: 700; white-space: nowrap; }
        .latest-ticker-link::before { content: '•'; color: #ff9900; margin-left: 8px; }
        @keyframes latestTickerMove { from { transform: translateX(-50%); } to { transform: translateX(0); } }
        @media (prefers-reduced-motion: reduce) { .latest-ticker-track { animation: none; } }
        .container { max-width: 820px; margin: 20px auto; background: white; padding: 30px; border-radius: 14px; border: 1px solid #e0e0e0; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }

        .notification-button svg { width: 22px; height: 22px; }

        .notification-description { margin: 0; color: #666; font-size: 14px; line-height: 1.7; text-align: right; }
        
        /* تعديل ارتفاع وحجم الحاوية ليتناسب مع الفيديو بالكامل دون قص */
        .video-container { width: 100%; height: 350px; margin-bottom: 20px; border-radius: 8px; overflow: hidden; background: #000; }
        .video-container iframe, .video-container video { width: 100%; height: 100%; border: none; }
        .video-error { color: #ffd6d6; background: #4b1111; padding: 12px; margin: 0; font-size: 14px; }

        .extra-images { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 25px; padding-bottom: 10px; }
        .extra-images img { width: 120px; height: 90px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; }
        @media (max-width: 768px) {
            .header { width: 100%; max-width: 100%; flex-wrap: wrap; padding: 12px 16px; }
            .header > * { min-width: 0; }
            .header-logo { height: 40px; }
            .search-btn { margin-right: auto; }
            .search-area.open { order: 3; flex-basis: 100%; max-width: none; }

            .category-link { font-size: 14px; padding: 7px 9px; }
            .latest-ticker { width: 100%; max-width: 100%; padding: 0 12px; gap: 8px; }
            .latest-ticker-label { padding: 5px 8px; font-size: 12px; }
            .latest-ticker-link { font-size: 13px; }
            .container { width: calc(100% - 24px); max-width: calc(100% - 24px); margin: 14px auto; padding: 18px 14px; border-radius: 10px; }
            .container > * { max-width: 100%; }
            h1 { font-size: 24px; }
            .content { font-size: 16px; line-height: 1.8; }
            .video-container { height: 56vw; min-height: 210px; }
            .share-actions { gap: 7px; }
            .share-label { flex-basis: 100%; }
            .notification-prompt { align-items: flex-start; }
            .notification-description { font-size: 13px; }
        }
        @media (max-width: 480px) {
            .header { gap: 8px; }
            .header-logo { max-width: 150px; height: auto; }
            .search-btn { width: 38px; height: 38px; }
            .search-btn svg { width: 27px; height: 27px; }
            .categories-bar { flex-wrap: nowrap; white-space: nowrap; overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
            .categories-bar::-webkit-scrollbar { height: 5px; }
            .categories-bar::-webkit-scrollbar-thumb { background: #b7c1cc; border-radius: 10px; }
            .category-item { flex: 0 0 auto; }
            .category-link { font-size: 13px; padding: 6px 7px; }
            .sub-menu { position: fixed; top: auto; right: 10px; left: 10px; min-width: 0; max-height: 60vh; overflow-y: auto; }
            .main-img { border-radius: 8px; }
            .share-button, .notification-button { width: 38px; height: 38px; }
            .share-button svg, .notification-button svg { width: 19px; height: 19px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <a class="header-logo-link" href="index.html" aria-label="الرئيسية">
            <img class="header-logo" src="https://e.top4top.io/p_3904fkgrk1.png" alt="شعار الموقع">

        <form class="search-area" id="search-area">
            <input id="search-input" type="search" placeholder="ابحث في المواضيع" aria-label="البحث">
            <button type="submit">بحث</button>
        </form>
        <button class="search-btn" title="بحث" aria-label="فتح البحث">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
        <button class="install-btn" id="install-btn" type="button">تثبيت التطبيق</button>

    <div class="categories-bar" id="categories-bar"></div>
    <div class="latest-ticker" id="latest-ticker" aria-label="آخر المواضيع" hidden>
        <span class="latest-ticker-label">آخر المواضيع</span>
        <div class="latest-ticker-window"><div class="latest-ticker-track" id="latest-ticker-track"></div></div>
    </div>

    <div class="container" id="article-container">
        <p style="text-align: center;">جاري تحميل الموضوع...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdpCRwQ14IdBa-gFV-Hh5d2gj_oDzdGp0",
            authDomain: "iraq-net-1980.firebaseapp.com",
            databaseURL: "https://iraq-net-1980-default-rtdb.firebaseio.com",
            projectId: "iraq-net-1980",
            storageBucket: "iraq-net-1980.firebasestorage.app",
            messagingSenderId: "901603428041",
            appId: "1:901603428041:web:78a9894df84ed9c09aaf18",
            measurementId: "G-BESTP0T6PC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');
        let deferredInstallPrompt = null;

        function setupInstallPrompt() {
            const installButton = document.getElementById('install-btn');
            if (!installButton) return;
            window.addEventListener('beforeinstallprompt', (event) => {
                event.preventDefault();
                deferredInstallPrompt = event;
                installButton.classList.add('visible');
            });
            installButton.addEventListener('click', async () => {
                if (!deferredInstallPrompt) return;
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
                installButton.classList.remove('visible');
            });
            window.addEventListener('appinstalled', () => installButton.classList.remove('visible'));
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
        }

        function renderLatestTicker(snapshot) {
            const articles = snapshot.exists() ? Object.entries(snapshot.val() || {})
                .map(([id, article]) => ({ id, ...(article || {}) }))
                .sort((first, second) => Number(second.createdAt || 0) - Number(first.createdAt || 0))
                .slice(0, 10) : [];
            const links = articles.length
                ? articles.map((article) => `<a class="latest-ticker-link" href="article.html?id=${encodeURIComponent(article.id)}">${escapeHtml(article.title || 'موضوع جديد')}</a>`).join('')
                : '<span class="latest-ticker-link">لا توجد مواضيع منشورة حاليًا</span>';
            document.querySelectorAll('.latest-ticker').forEach((ticker) => {
                const track = ticker.querySelector('.latest-ticker-track');
                if (!track) return;
                track.innerHTML = links + links;
                ticker.hidden = false;
            });
        }

        function loadCategories() {
            get(ref(db, 'categories')).then((snapshot) => {
                const bar = document.getElementById('categories-bar');
                syncStickyBarHeight();
                bar.innerHTML = '<a href="index.html" class="category-link">الرئيسية</a>';
                if (!snapshot.exists()) return;
                const categories = [];
                snapshot.forEach((child) => categories.push({
                    id: child.key,
                    name: child.val()?.name || 'قسم',
                    parentId: child.val()?.parentId || null
                }));
                const renderTree = (parentId = null) => categories
                    .filter((category) => category.parentId === parentId)
                    .map((category) => {
                        const children = renderTree(category.id);
                        const submenu = children ? `<div class="sub-menu">${children}</div>` : '';
                        return `<div class="category-item">
                            <a href="index.html?category=${encodeURIComponent(category.id)}" class="category-link">${category.name}</a>
                            ${submenu ? `<button type="button" class="category-toggle" title="فتح الأقسام الفرعية" aria-label="فتح الأقسام الفرعية لقسم ${category.name}" aria-expanded="false">⌄</button>` : ''}
                            ${submenu}
                        </div>`;
                    }).join('');
                bar.insertAdjacentHTML('beforeend', renderTree());
                bar.querySelectorAll('.category-item > .category-toggle').forEach((toggle) => {
                    const submenu = toggle.parentElement.querySelector('.sub-menu');
                    if (!submenu) return;
                    toggle.addEventListener('click', (event) => {
                        event.stopPropagation();
                        const item = toggle.parentElement;
                        const isOpen = item.classList.toggle('open');
                        toggle.setAttribute('aria-expanded', String(isOpen));
                    });
                });
            }).catch(() => {
                document.getElementById('categories-bar').innerHTML = '<a href="index.html" class="category-link">الرئيسية</a>';
                syncStickyBarHeight();
            });
        }

        function syncStickyBarHeight() {
            const categoriesBar = document.getElementById('categories-bar');
            if (categoriesBar) document.documentElement.style.setProperty('--categories-bar-height', `${categoriesBar.offsetHeight}px`);
        }

        document.addEventListener('click', (event) => {
            document.querySelectorAll('.category-item.open').forEach((item) => {
                if (item.contains(event.target)) return;
                item.classList.remove('open');
                const toggle = item.querySelector(':scope > .category-toggle');
                if (toggle) toggle.setAttribute('aria-expanded', 'false');
            });
        });

        const searchArea = document.getElementById('search-area');
        const searchInput = document.getElementById('search-input');
        document.querySelector('.search-btn').addEventListener('click', () => {
            searchArea.classList.toggle('open');
            if (searchArea.classList.contains('open')) searchInput.focus();
        });
        searchArea.addEventListener('submit', (event) => {
            event.preventDefault();
            const query = searchInput.value.trim();
            window.location.href = query ? `index.html?q=${encodeURIComponent(query)}` : 'index.html';
        });

        function getEmbedUrl(url) {
            if (!url) return '';
            const trimmed = url.trim();
            try {
                const parsedUrl = new URL(trimmed);
                let videoId = '';
                if (parsedUrl.hostname === 'youtu.be') {
                    videoId = parsedUrl.pathname.slice(1);
                } else if (parsedUrl.hostname.includes('youtube.com')) {
                    if (parsedUrl.pathname === '/watch') videoId = parsedUrl.searchParams.get('v') || '';
                    if (parsedUrl.pathname.startsWith('/shorts/')) videoId = parsedUrl.pathname.split('/')[2] || '';
                    if (parsedUrl.pathname.startsWith('/live/')) videoId = parsedUrl.pathname.split('/')[2] || '';
                    if (parsedUrl.pathname.startsWith('/embed/')) videoId = parsedUrl.pathname.split('/')[2] || '';
                }
                if (videoId) {
                    const origin = window.location.protocol === 'http:' || window.location.protocol === 'https:'
                        ? `&origin=${encodeURIComponent(window.location.origin)}`
                        : '';
                    return `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?rel=0&playsinline=1${origin}`;
                }
            } catch (error) {
                return '';
            }
            return trimmed;
        }

        function isHlsUrl(url) {
            return /\.m3u8(?:$|[?#])/i.test(url || '') || /(?:format|type)=?(?:hls|application\/x-mpegurl)/i.test(url || '');
        }

        function isDashUrl(url) {
            return /\.mpd(?:$|[?#])/i.test(url || '') || /(?:format|type)=?(?:dash|application\/dash\+xml)/i.test(url || '');
        }

        function loadHlsLibrary() {
            if (window.Hls) return Promise.resolve(window.Hls);
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js';
                script.onload = () => resolve(window.Hls);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function loadDashLibrary() {
            if (window.dashjs) return Promise.resolve(window.dashjs);
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.dashjs.org/latest/dash.all.min.js';
                script.onload = () => resolve(window.dashjs);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        function showVideoError(video, message) {
            video.insertAdjacentHTML('afterend', `<p class="video-error">${message}</p>`);
        }

        function setupHlsVideo(video, url) {
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                return;
            }
            loadHlsLibrary().then((Hls) => {
                if (!Hls || !Hls.isSupported()) throw new Error('HLS غير مدعوم في هذا المتصفح');
                const player = new Hls();
                player.loadSource(url);
                player.attachMedia(video);
                video.addEventListener('error', () => showVideoError(video, 'تعذر تشغيل بث HLS. تحقق من الرابط والسماح بـ CORS.'));
            }).catch(() => {
                showVideoError(video, 'تعذر تشغيل رابط m3u8 في هذا المتصفح. تحقق من الرابط والسماح بـ CORS.');
            });
        }

        function setupDashVideo(video, url) {
            loadDashLibrary().then((dashjs) => {
                if (!dashjs || !dashjs.MediaPlayer) throw new Error('DASH غير مدعوم');
                const player = dashjs.MediaPlayer().create();
                player.initialize(video, url, false);
                player.on(dashjs.MediaPlayer.events.ERROR, () => {
                    showVideoError(video, 'تعذر تشغيل بث DASH. تحقق من الرابط والسماح بـ CORS.');
                });
            }).catch(() => {
                showVideoError(video, 'تعذر تشغيل رابط mpd في هذا المتصفح.');
            });
        }

        function buildShareHtml(title) {
            const pageUrl = encodeURIComponent(window.location.href);
            const encodedTitle = encodeURIComponent(title);
            return `<div class="share-actions" aria-label="مشاركة الموضوع">
                <span class="share-label">مشاركة الموضوع:</span>
                <button type="button" class="share-button share-trigger" id="share-trigger" title="إظهار خيارات المشاركة" aria-label="إظهار خيارات المشاركة" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="2"></circle><circle cx="6" cy="12" r="2"></circle><circle cx="18" cy="19" r="2"></circle><path d="m8 11 8-5M8 13l8 5"></path></svg></button>
                <div class="share-options" id="share-options">
                    <a class="share-button share-whatsapp" href="https://wa.me/?text=${encodedTitle}%20${pageUrl}" target="_blank" rel="noopener noreferrer" title="مشاركة عبر واتساب" aria-label="مشاركة عبر واتساب"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.66 15L2 22l5.18-1.32A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.08-1.12l-.29-.17-3.07.78.82-2.99-.19-.3A8 8 0 1 1 12 20Zm4.35-5.84c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.01-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.48-.4-.41-.54-.42h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.15 1.51.09.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28Z"></path></svg></a>
                    <a class="share-button share-facebook" href="https://www.facebook.com/sharer/sharer.php?u=${pageUrl}" target="_blank" rel="noopener noreferrer" title="مشاركة عبر فيسبوك" aria-label="مشاركة عبر فيسبوك"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3h-3.1V9.1c0-.87.24-1.46 1.5-1.46h1.7V5a22 22 0 0 0-2.47-.13c-2.45 0-4.13 1.5-4.13 4.25V11H7.4v3h2.7v8h3.4Z"></path></svg></a>
                    <a class="share-button share-telegram" href="https://t.me/share/url?url=${pageUrl}&text=${encodedTitle}" target="_blank" rel="noopener noreferrer" title="مشاركة عبر تيليجرام" aria-label="مشاركة عبر تيليجرام"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m21.5 3.5-3.2 15.1c-.24 1.07-.87 1.34-1.76.84l-4.84-3.57-2.34 2.25c-.26.26-.48.48-.98.48l.35-4.93 8.97-8.1c.39-.35-.08-.55-.6-.2L6.02 11.9 1.25 10.4c-1.04-.33-1.06-1.04.22-1.54L20.1 1.58c.87-.32 1.63.2 1.4 1.92Z"></path></svg></a>
                    <a class="share-button share-x" href="https://twitter.com/intent/tweet?url=${pageUrl}&text=${encodedTitle}" target="_blank" rel="noopener noreferrer" title="مشاركة عبر X" aria-label="مشاركة عبر X"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.24l-4.89-6.39L6.48 22H3.37l7.24-8.28L2.8 2h6.4l4.42 5.84L18.9 2Zm-1.1 17.9h1.73L8.26 4.02H6.4L17.8 19.9Z"></path></svg></a>
                    <button type="button" class="share-button share-copy" id="copy-article-link" title="نسخ رابط الموضوع" aria-label="نسخ رابط الموضوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"></path></svg></button>
                </div>
                <span class="share-status" id="share-status" aria-live="polite"></span>
                <div class="notification-prompt">
                    <button type="button" class="notification-button" id="article-notification-btn" title="تفعيل التنبيهات" aria-label="تفعيل التنبيهات">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                    <p class="notification-description">تلقّ تنبيهات وتحديثات فورية بحسب اهتمامك. كن أول من يعلم بالمواضيع</p>
                </div>
            </div>`;
        }

        function setupCopyLinkButton() {
            const copyButton = document.getElementById('copy-article-link');
            const status = document.getElementById('share-status');
            if (!copyButton || !status) return;
            copyButton.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    status.textContent = 'تم نسخ الرابط';
                } catch (error) {
                    status.textContent = 'تعذر نسخ الرابط تلقائيًا';
                }
            });
        }

        function setupShareButton(title) {
            const trigger = document.getElementById('share-trigger');
            const options = document.getElementById('share-options');
            if (!trigger || !options) return;
            trigger.addEventListener('click', () => {
                const open = options.classList.toggle('open');
                trigger.setAttribute('aria-expanded', String(open));
            });
        }

        function setupArticleNotifications() {
            const button = document.getElementById('article-notification-btn');
            if (!button || !('Notification' in window)) {
                if (button) button.disabled = true;
                return;
            }
            if (Notification.permission === 'granted' || localStorage.getItem('notificationsEnabled') === 'true') {
                button.classList.add('enabled');
                button.title = 'التنبيهات مفعلة';
            }
            button.addEventListener('click', async () => {
                if (Notification.permission === 'denied') {
                    button.title = 'التنبيهات محظورة من إعدادات المتصفح';
                    return;
                }
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') return;
                localStorage.setItem('notificationsEnabled', 'true');
                button.classList.add('enabled');
                button.title = 'التنبيهات مفعلة';
                new Notification('العراق نت', {
                    body: 'تم تفعيل تنبيهات الموقع بنجاح',
                    icon: 'https://e.top4top.io/p_3903807hh1.png',
                    badge: 'https://e.top4top.io/p_3903807hh1.png'
                });
            });
        }

        loadCategories();
        if ('ResizeObserver' in window) new ResizeObserver(syncStickyBarHeight).observe(document.getElementById('categories-bar'));
        window.addEventListener('resize', syncStickyBarHeight);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
        setupInstallPrompt();
        get(ref(db, 'articles')).then(renderLatestTicker).catch(() => renderLatestTicker({ exists: () => false }));

        if (articleId) {
            get(ref(db, 'articles/' + articleId)).then((snapshot) => {
                const container = document.getElementById('article-container');
                if (snapshot.exists()) {
                    const art = snapshot.val();
                    const title = art.title || 'عنوان غير متاح';
                    document.title = title;
                    const imageUrl = art.imageUrl || 'https://g.top4top.io/p_3903k37401.png';
                    const content = art.content || 'لا توجد تفاصيل لهذا المقال.';
                    const mainImageHtml = `<img src="${imageUrl}" alt="${title}" class="main-img">`;

                    let videoHtml = '';
                    const videoUrls = Array.isArray(art.videoUrls) && art.videoUrls.length
                        ? art.videoUrls.filter(Boolean)
                        : (art.videoUrl ? [art.videoUrl] : []);
                    videoUrls.forEach((videoUrl, index) => {
                        const processedUrl = getEmbedUrl(videoUrl);
                        if (processedUrl.includes('youtube.com/embed')) {
                            videoHtml += `<div class="video-container"><iframe src="${processedUrl}" title="فيديو الموضوع" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="origin" allowfullscreen></iframe></div>`;
                        } else if (isHlsUrl(videoUrl)) {
                            videoHtml += `<div class="video-container"><video id="hls-video-${index}" controls playsinline></video></div>`;
                        } else if (isDashUrl(videoUrl)) {
                            videoHtml += `<div class="video-container"><video id="dash-video-${index}" controls playsinline></video></div>`;
                        } else {
                            videoHtml += `<div class="video-container"><video controls src="${videoUrl}"></video></div>`;
                        }
                    });

                    let extraImagesHtml = '';
                    if (art.extraImages) {
                        const imgs = art.extraImages.split(',');
                        let imgTags = '';
                        imgs.forEach(img => {
                            if (img && img.trim()) {
                                imgTags += `<img src="${img.trim()}" alt="صورة إضافية">`;
                            }
                        });
                        if (imgTags) {
                            extraImagesHtml = `<div class="extra-images">${imgTags}</div>`;
                        }
                    }

                    container.innerHTML = `
                        <h1>${title}</h1>
                        ${mainImageHtml}
                        ${videoHtml}
                        <div class="content">${content}</div>
                        ${buildShareHtml(title)}
                        ${extraImagesHtml}
                    `;
                    setupCopyLinkButton();
                    setupShareButton(title);
                    setupArticleNotifications();
                    videoUrls.forEach((videoUrl, index) => {
                        if (isHlsUrl(videoUrl)) setupHlsVideo(document.getElementById(`hls-video-${index}`), videoUrl);
                        if (isDashUrl(videoUrl)) setupDashVideo(document.getElementById(`dash-video-${index}`), videoUrl);
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; color: red;">الموضوع غير موجود.</p>';
                }
            }).catch(() => {
                document.getElementById('article-container').innerHTML = '<p style="text-align: center; color: red;">حدث خطأ أثناء تحميل الموضوع.</p>';
            });
        } else {
            document.getElementById('article-container').innerHTML = '<p style="text-align: center; color: red;">لم يتم تحديد الموضوع.</p>';
        }
    </script>
