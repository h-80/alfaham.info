<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العراق نت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        body { margin: 0; background-color: #f4f4f4; }
        .header { background-color: #123456; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header-logo { height: 45px; }
        .search-btn { background: transparent; border: none; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; }
        .search-btn svg { width: 24px; height: 24px; }
        .categories-bar { background-color: #ffffff; padding: 12px 20px; display: flex; gap: 25px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #e0e0e0; }
        .category-link { color: #123456; text-decoration: none; font-size: 16px; font-weight: bold; transition: color 0.3s; }
        .category-link:hover { color: #ff9900; }
        .main-story { margin: 30px 20px; text-align: center; cursor: pointer; }
        .main-story img { width: 100%; height: auto; display: block; }
        .main-story h2 { background-color: #ffffff; color: #333333; margin-top: 10px; padding: 15px; font-size: 24px; border-radius: 10px; border: 1px solid #e0e0e0; }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 0 20px 50px 20px; max-width: 1200px; margin: 0 auto; }
        .article-card { background-color: white; border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; text-decoration: none; display: flex; flex-direction: row; transition: transform 0.2s; }
        .article-card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .article-card img { width: 40%; height: auto; object-fit: contain; display: block; }
        .article-info { margin: 0; padding: 15px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
        .article-info h3 { margin: 0; font-size: 18px; font-weight: bold; color: #333; text-align: right; }
        .article-info p { margin: 8px 0 0 0; font-size: 14px; color: #666; text-align: right; line-height: 1.5; }
        .pagination { display: flex; gap: 10px; margin: 20px auto; padding: 0 20px; max-width: 1200px; justify-content: center; align-items: center; }
        .pagination a { background-color: #f4f4f4; color: #333; border: 1px solid #e0e0e0; border-radius: 10px; padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .pagination a:hover { background-color: #123456; color: white; border-color: #123456; }
        .pagination a.active { background-color: #123456; color: white; border-color: #123456; }
        .footer { background-color: #f4f4f4; color: #333; text-align: center; padding: 20px; margin-top: 20px; border-top: 1px solid #e0e0e0; }
    </style>
</head>
<body>
    <div class="header">
        <img class="header-logo" src="https://raw.githubusercontent.com/h-80/img/refs/heads/main/T401788815613684.png" alt="شعار الموقع">
        <button class="search-btn" title="بحث">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </div>
    <div class="categories-bar" id="categories-bar"></div>
    <div class="main-story" id="main-story" style="display: none;"></div>
    <div class="grid-container" id="articles-grid"></div>
    <div class="pagination" id="pagination"></div>
    <div class="footer">جميع الحقوق محفوظة © 2025</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdpCRwQ14IdBa-gFV-Hh5d2gj_oDzdGp0",
            authDomain: "iraq-net-1980.firebaseapp.com",
            databaseURL: "https://iraq-net-1980-default-rtdb.firebaseio.com",
            projectId: "iraq-net-1980",
            storageBucket: "iraq-net-1980.firebasestorage.app",
            messagingSenderId: "901603428041",
            appId: "1:901603428041:web:78a9894df84ed9c09aaf18",
            measurementId: "G-BESTP0T6PC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allArticles = [];

        function loadCategories() {
            get(ref(db, 'categories'))
                .then((snapshot) => {
                    const bar = document.getElementById('categories-bar');
                    bar.innerHTML = '<a href="#" class="category-link" data-id="all">الكل</a>';
                    snapshot.forEach((child) => {
                        const cat = child.val();
                        bar.innerHTML += `<a href="#" class="category-link" data-id="${child.key}">${cat.name}</a>`;
                    });

                    document.querySelectorAll('.category-link').forEach(link => {
                        link.addEventListener('click', (e) => {
                            e.preventDefault();
                            const catId = e.target.getAttribute('data-id');
                            if (catId === 'all') {
                                displayArticles(allArticles);
                            } else {
                                const filtered = allArticles.filter(art => art.categoryId === catId);
                                displayArticles(filtered);
                            }
                        });
                    });
                });
        }

        function loadArticles() {
            get(ref(db, 'articles'))
                .then((snapshot) => {
                    allArticles = [];
                    snapshot.forEach((child) => {
                        allArticles.push({ id: child.key, ...child.val() });
                    });
                    displayArticles(allArticles);
                });
        }

        function displayArticles(articles) {
            const grid = document.getElementById('articles-grid');
            const mainStory = document.getElementById('main-story');
            grid.innerHTML = '';
            
            if (articles.length > 0) {
                const first = articles[0];
                mainStory.style.display = 'block';
                mainStory.innerHTML = `
                    <a href="article.html?id=${first.id}" style="text-decoration: none; color: inherit;">
                        <img src="${first.imageUrl}" alt="${first.title}">
                        <h2>${first.title}</h2>
                    </a>`;
            } else {
                mainStory.style.display = 'none';
            }
            
            for (let i = 1; i < articles.length; i++) {
                const article = articles[i];
                grid.innerHTML += `
                    <a href="article.html?id=${article.id}" class="article-card">
                        <img src="${article.imageUrl}" alt="${article.title}">
                        <div class="article-info">
                            <h3>${article.title}</h3>
                            <p>${article.content ? article.content.substring(0, 100) : ''}...</p>
                        </div>
                    </a>`;
            }
        }

        loadCategories();
        loadArticles();
    </script>
</body>
</html>
